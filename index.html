      body {

      ::selection { background: #C084FC; color: #000; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }

      .glass {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(192, 132, 252, 0.1);
      }
      
      .stars-vibrant {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 40px 70px, #C084FC, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 90px 40px, #3B82F6, rgba(0,0,0,0)),
          radial-gradient(1.5px 1.5px at 130px 80px, #fff, rgba(0,0,0,0));
        background-repeat: repeat;
        background-size: 250px 250px;
        animation: twinkle 4s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        from { opacity: 0.2; transform: scale(1); }
        to { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); }
        50% { box-shadow: 0 0 50px rgba(192, 132, 252, 0.6); }
      }
      .animate-glow { animation: glow 3s ease-in-out infinite; }
      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-bounce-slow { animation: bounce-slow 4s ease-in-out infinite; }

      /* Animation d'impulsion lumineuse */
      @keyframes impulse-glow {
        0% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.4); transform: scale(1); }
        50% { box-shadow: 0 0 40px 10px rgba(192, 132, 252, 0.2); transform: scale(1.03); }
        100% { box-shadow: 0 0 0 0 rgba(192, 132, 252, 0); transform: scale(1); }
      }
      .animate-impulse {
        animation: impulse-glow 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
